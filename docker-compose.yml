services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck: {test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 5s, timeout: 5s, retries: 20}
  mongo-init:
    image: mongo:7
    depends_on: {mongo: {condition: service_healthy}}
    restart: "no"
    entrypoint:
      - bash
      - -c
      - "mongosh --host mongo --quiet --eval \"try{rs.status()}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})}\""
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment: {MONGODB_URI: "mongodb://mongo:27017/pathey?replicaSet=rs0"}
    ports: ["4000:4000"]
    volumes: ["candidate-photos:/app/storage"]
    depends_on: {mongo-init: {condition: service_completed_successfully}}
    healthcheck: {test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/docs').then(r=>process.exit(r.ok?0:1))\""], interval: 20s, timeout: 5s, retries: 5}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: {NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"}
    environment: {NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"}
    ports: ["3000:3000"]
    depends_on: {api: {condition: service_healthy}}
volumes:
  mongo-data:
  candidate-photos:
