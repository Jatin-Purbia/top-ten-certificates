name: Keep API warm
on:
  schedule:
    # Render's free tier sleeps a web service after ~15 minutes idle and the
    # next request pays a 30-60s+ cold start — pinging well under that
    # window keeps it from ever going idle long enough to sleep.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -sf -o /dev/null https://top-ten-certificates.onrender.com/api/v1/public/cycles
